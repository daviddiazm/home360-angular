<label class="input-text__label" [ngClass]="{ 'input-text--disabled': disabled }" [for]="label">
  <div class="input-text__label-title">
    {{ label }}
    <span *ngIf="required" class="input-text__required input-text__span">*</span>
  </div>
  <input
    class="input-text__input"
    [placeholder]="placeholder"
    [value]="value"
    [required]="required"
    [disabled]="disabled"
    (input)="handleInput($event)"
    (blur)="onTouched()"
    [id]="label"
    type="text"
  >
  <span *ngIf="!errorMessage">
    {{'&nbsp;'}}
  </span>
  <span class="input-text__span">
    {{errorMessage}}
  </span>
</label>
